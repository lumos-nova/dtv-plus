name: Windows Installer

# Windows 发布流水线：push 形如 v4.1.0 的 tag 时自动构建安装包并发布到 Releases；
# 也可以在 Actions 页面手动 Run workflow（仅产出 artifacts，不发 Release）。
#
# 产物（均为 per-user 安装、可选安装目录、未签名）：
#   - DTV-<version>-amd64.msi        WiX v3 生成的 Windows Installer
#   - DTV-<version>-amd64-setup.exe  NSIS 安装包，内置 WebView2 bootstrapper
#
# 未配置 Authenticode 证书：首次运行可能触发 SmartScreen 提示，
# 选择「更多信息 → 仍要运行」即可；MSI 与 NSIS 都不要求管理员权限。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows amd64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Wails3 CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 与本地验证一致的构建参数：不要加 -trimpath / -buildvcs=false / production tag
      # （Wails v3.0.0 纯 Go WebView2 loader 对这些敏感，见 build/windows/Taskfile.yml 注释）
      - name: Build app (unsigned)
        run: wails3 build SIGN_ENABLED=false

      - name: Download WiX v3
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile "$env:RUNNER_TEMP\wix.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\wix.zip" -DestinationPath "$env:RUNNER_TEMP\wix" -Force
          "WIX_BIN=$env:RUNNER_TEMP\wix" >> $env:GITHUB_ENV

      - name: Build MSI
        run: wails3 task windows:msi WIX_BIN="${{ env.WIX_BIN }}"

      # Chocolatey 社区源偶发 503 且 choco 失败仍返回 0（见 2026-11-24 构建日志），
      # 改为直接从 SourceForge 官方镜像下载 NSIS 压缩包，多镜像 + 重试 + makensis 自检。
      - name: Install NSIS (direct download)
        shell: pwsh
        run: |
          $nsisVersion = "3.11"
          $dest = "$env:RUNNER_TEMP\nsis"
          $zip = "$env:RUNNER_TEMP\nsis.zip"
          $urls = @(
            "https://downloads.sourceforge.net/project/nsis/NSIS%203/$nsisVersion/nsis-$nsisVersion.zip",
            "https://master.dl.sourceforge.net/project/nsis/NSIS%203/$nsisVersion/nsis-$nsisVersion.zip?viasf=1",
            "https://phoenixnap.dl.sourceforge.net/project/nsis/NSIS%203/$nsisVersion/nsis-$nsisVersion.zip"
          )
          $nsisDir = $null
          foreach ($url in $urls) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Write-Host "Downloading NSIS from $url (attempt $attempt)"
                Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 180
                Expand-Archive -Path $zip -DestinationPath $dest -Force
                # 官方 zip 内是 nsis-<version>/ 目录
                $root = Get-ChildItem $dest -Directory | Where-Object { Test-Path (Join-Path $_.FullName "makensis.exe") } | Select-Object -First 1
                $nsisDir = if ($root) { $root.FullName } elseif (Test-Path "$dest\makensis.exe") { $dest } else { $null }
                if (-not $nsisDir) { throw "makensis.exe not found in archive" }
                break
              } catch {
                Write-Warning "Attempt $attempt failed: $_"
                Remove-Item $zip -Force -ErrorAction SilentlyContinue
                Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
            if ($nsisDir) { break }
          }
          if (-not $nsisDir) { throw "Failed to install NSIS from all mirrors" }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          # 立即自检，失败就让本步骤红掉，而不是拖到 makensis 调用时才报 127
          & "$nsisDir\makensis.exe" /VERSION
          if ($LASTEXITCODE -ne 0) { throw "makensis not usable" }

      - name: Build NSIS installer (with WebView2 bootstrapper)
        run: wails3 task windows:create:nsis:installer SIGN_ENABLED=false INSTALL_SCOPE=user

      - name: Rename artifacts with version
        shell: pwsh
        run: |
          $line = Get-Content build/config.yml | Select-String '^\s*version:\s*"([^"]+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          if (-not $version) { throw "version not found in build/config.yml" }
          Copy-Item bin/dtv-amd64.msi "bin/DTV-$version-amd64.msi"
          Copy-Item bin/dtv-amd64-installer.exe "bin/DTV-$version-amd64-setup.exe"
          "VERSION=$version" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            bin/DTV-*-amd64.msi
            bin/DTV-*-amd64-setup.exe
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/DTV-*-amd64.msi
            bin/DTV-*-amd64-setup.exe
          generate_release_notes: true
          fail_on_unmatched_files: true